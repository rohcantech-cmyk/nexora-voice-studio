<script>

const $ = id => document.getElementById(id);

let busy = false;
let currentUrl = null;
let masterUrl = null;

const script = $('script');
const count = $('count');
const msg = $('msg');
const audio = $('audio');
const audioCard = $('audioCard');
const download = $('download');
const cinDownload = $('cinDownload');


/* =========================
   SCRIPT CHARACTER COUNT
========================= */

script.addEventListener('input', () => {

  count.textContent =
    script.value.length;

});


/* =========================
   DIRECTION MODES
========================= */

document.querySelectorAll('.mode').forEach(button => {

  button.addEventListener('click', () => {

    document
      .querySelectorAll('.mode')
      .forEach(x =>
        x.classList.remove('active')
      );

    button.classList.add('active');

    $('pace').value =
      button.dataset.rate;

    $('temp').value =
      button.dataset.temp;

    updateRanges();

  });

});


/* =========================
   RANGE CONTROLS
========================= */

[
  'pace',
  'temp',
  'pause',
  'room',
  'warm',
  'master'
].forEach(id => {

  $(id).addEventListener(
    'input',
    updateRanges
  );

});


function updateRanges(){

  $('paceVal').textContent =
    (+$('pace').value).toFixed(2) + '×';

  $('tempVal').textContent =
    (+$('temp').value).toFixed(2);

  $('pauseVal').textContent =
    ['Low','Medium','High'][
      +$('pause').value
    ];

  $('roomVal').textContent =
    $('room').value + '%';

  $('warmVal').textContent =
    $('warm').value + '%';

  $('masterVal').textContent =
    $('master').value + '%';

}


/* =========================
   INSERT DIRECTION TAGS
========================= */

document.querySelectorAll('.tag').forEach(button => {

  button.addEventListener('click', () => {

    const start =
      script.selectionStart;

    const end =
      script.selectionEnd;

    const insert =
      button.dataset.insert;

    script.value =
      script.value.slice(0,start) +
      insert +
      script.value.slice(end);

    script.focus();

    script.selectionStart =
      script.selectionEnd =
      start + insert.length;

    count.textContent =
      script.value.length;

  });

});


/* =========================
   STATUS MESSAGE
========================= */

function show(message,type){

  msg.textContent =
    String(message || '');

  msg.className =
    'msg ' + type;

}


/* =========================
   SAFE ERROR MESSAGE
   NEVER SHOW [object Object]
========================= */

function getErrorMessage(error,data){

  const candidates = [

    error?.message,

    data?.error?.message,

    data?.error?.details,

    data?.message,

    data?.detail,

    data?.error

  ];

  for(const value of candidates){

    if(
      typeof value === 'string' &&
      value.trim() &&
      value !== '[object Object]'
    ){

      return value.trim();

    }

  }

  try{

    if(data?.error){

      const json =
        JSON.stringify(data.error);

      if(
        json &&
        json !== '{}' &&
        json !== '"[object Object]"'
      ){

        return json;

      }

    }

  }catch(_){}

  return 'Voice generation failed. Please try again.';

}


/* =========================
   STOP
========================= */

$('stop').onclick = () => {

  audio.pause();

  audio.currentTime = 0;

};


/* =========================
   BASE64 AUDIO → BLOB
========================= */

function base64Blob(base64,type){

  if(
    typeof base64 !== 'string' ||
    !base64.trim()
  ){

    throw new Error(
      'Voice server did not return audio.'
    );

  }

  try{

    const cleanBase64 =
      base64.includes(',')
        ? base64.split(',').pop()
        : base64;

    const binary =
      atob(cleanBase64);

    const bytes =
      new Uint8Array(
        binary.length
      );

    for(
      let i = 0;
      i < binary.length;
      i++
    ){

      bytes[i] =
        binary.charCodeAt(i);

    }

    return new Blob(
      [bytes],
      {type}
    );

  }catch(error){

    throw new Error(
      'Invalid audio data received from voice server.'
    );

  }

}


/* =========================
   AUDIO BUFFER → WAV
========================= */

function audioBufferToWav(buffer){

  const channels =
    buffer.numberOfChannels;

  const sampleRate =
    buffer.sampleRate;

  const length =
    buffer.length;

  const dataLength =
    length * channels * 2;

  const arrayBuffer =
    new ArrayBuffer(
      44 + dataLength
    );

  const view =
    new DataView(arrayBuffer);

  let offset = 0;


  const writeString = value => {

    for(
      let i = 0;
      i < value.length;
      i++
    ){

      view.setUint8(
        offset++,
        value.charCodeAt(i)
      );

    }

  };


  const writeUint32 = value => {

    view.setUint32(
      offset,
      value,
      true
    );

    offset += 4;

  };


  const writeUint16 = value => {

    view.setUint16(
      offset,
      value,
      true
    );

    offset += 2;

  };


  writeString('RIFF');

  writeUint32(
    36 + dataLength
  );

  writeString('WAVE');

  writeString('fmt ');

  writeUint32(16);

  writeUint16(1);

  writeUint16(channels);

  writeUint32(sampleRate);

  writeUint32(
    sampleRate *
    channels *
    2
  );

  writeUint16(
    channels * 2
  );

  writeUint16(16);

  writeString('data');

  writeUint32(dataLength);


  const masterGain =
    Math.max(
      0,
      Math.min(
        1.15,
        +$('master').value / 100
      )
    );


  const warmth =
    +$('warm').value / 100;


  for(
    let i = 0;
    i < length;
    i++
  ){

    for(
      let channel = 0;
      channel < channels;
      channel++
    ){

      let sample =
        buffer
          .getChannelData(channel)[i];


      sample =
        Math.tanh(
          sample *
          (1.05 + warmth * .9)
        ) *
        masterGain;


      sample =
        Math.max(
          -1,
          Math.min(
            1,
            sample
          )
        );


      view.setInt16(
        offset,
        sample < 0
          ? sample * 32768
          : sample * 32767,
        true
      );

      offset += 2;

    }

  }


  return new Blob(
    [arrayBuffer],
    {type:'audio/wav'}
  );

}


/* =========================
   CINEMATIC MASTER
========================= */

async function makeCinematic(blob){

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext){

    throw new Error(
      'Your browser does not support audio processing.'
    );

  }

  const ac =
    new AudioContext();


  try{

    const arrayBuffer =
      await blob.arrayBuffer();

    const source =
      await ac.decodeAudioData(
        arrayBuffer
      );


    const output =
      ac.createBuffer(
        source.numberOfChannels,
        source.length,
        source.sampleRate
      );


    const room =
      +$('room').value / 100;


    for(
      let channel = 0;
      channel < source.numberOfChannels;
      channel++
    ){

      const input =
        source.getChannelData(channel);

      const result =
        output.getChannelData(channel);


      const delay1 =
        Math.max(
          1,
          Math.floor(
            source.sampleRate *
            (
              .055 +
              room * .0009
            )
          )
        );


      const delay2 =
        Math.max(
          1,
          Math.floor(
            source.sampleRate *
            (
              .105 +
              room * .0015
            )
          )
        );


      for(
        let i = 0;
        i < input.length;
        i++
      ){

        let sample =
          input[i];

        let wet = 0;


        if(room > 0){

          if(i - delay1 >= 0){

            wet +=
              input[i - delay1] *
              room *
              .30;

          }


          if(i - delay2 >= 0){

            wet +=
              input[i - delay2] *
              room *
              .18;

          }


          if(i - delay1 * 2 >= 0){

            wet +=
              input[i - delay1 * 2] *
              room *
              .10;

          }

        }


        result[i] =
          Math.max(
            -1,
            Math.min(
              1,
              sample *
                (1 - room * .12) +
              wet
            )
          );

      }

    }


    return audioBufferToWav(
      output
    );

  }finally{

    try{

      await ac.close();

    }catch(_){}

  }

}


/* =========================
   GENERATE NEURAL VOICE
========================= */

$('generate').onclick = async () => {

  if(busy){

    return;

  }


  const text =
    script.value.trim();


  if(!text){

    show(
      'Pehle script paste karo.',
      'err'
    );

    return;

  }


  if(text.length > 2500){

    show(
      'Script 2500 characters se chhoti rakho.',
      'err'
    );

    return;

  }


  busy = true;

  const generateButton =
    $('generate');

  generateButton.disabled =
    true;

  generateButton.textContent =
    'Generating…';


  show(
    'Neural cinematic voice generate ho rahi hai…',
    'ok'
  );


  try{

    /* =========================
       TTS REQUEST
    ========================= */

    const response =
      await fetch(
        'https://ra-voice-studio.bgmihere16.workers.dev/api/tts',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json',
            'Accept':
              'application/json'
          },

          body:JSON.stringify({

            text:text,

            speaker:
              $('voice').value,

            language_code:
              $('language').value,

            pace:
              +$('pace').value,

            temperature:
              +$('temp').value

          })

        }
      );


    /* =========================
       SAFE RESPONSE PARSING
    ========================= */

    const responseText =
      await response.text();


    let data = null;


    try{

      data =
        responseText
          ? JSON.parse(responseText)
          : null;

    }catch(_){

      if(!response.ok){

        throw new Error(
          'Voice server returned an invalid response.'
        );

      }

      throw new Error(
        'Voice server returned invalid audio data.'
      );

    }


    /* =========================
       HTTP ERROR
    ========================= */

    if(!response.ok){

      throw new Error(
        getErrorMessage(
          null,
          data
        )
      );

    }


    /* =========================
       AUDIO DATA
    ========================= */

    const audioBase64 =
      data?.audio_base64;


    if(
      typeof audioBase64 !== 'string' ||
      !audioBase64.trim()
    ){

      throw new Error(
        getErrorMessage(
          null,
          data
        )
      );

    }


    const cleanBlob =
      base64Blob(
        audioBase64,
        'audio/mpeg'
      );


    /* =========================
       CLEAN MP3 URL
    ========================= */

    if(currentUrl){

      URL.revokeObjectURL(
        currentUrl
      );

    }


    currentUrl =
      URL.createObjectURL(
        cleanBlob
      );


    audio.src =
      currentUrl;


    download.href =
      currentUrl;


    audioCard.style.display =
      'block';


    show(
      'Voice ready. Cinematic Master process ho raha hai…',
      'ok'
    );


    /* =========================
       CINEMATIC MASTER
    ========================= */

    if(masterUrl){

      URL.revokeObjectURL(
        masterUrl
      );

      masterUrl = null;

    }


    const cinematic =
      await makeCinematic(
        cleanBlob
      );


    masterUrl =
      URL.createObjectURL(
        cinematic
      );


    cinDownload.href =
      masterUrl;


    show(
      '🎬 Cinematic Master ready — play karke check karo aur download karo.',
      'ok'
    );

  }catch(error){

    /*
      FINAL SAFETY:
      No matter what the server/browser
      returns, [object Object] will never
      be shown to the user.
    */

    const message =
      getErrorMessage(
        error,
        null
      );


    show(
      message,
      'err'
    );

  }finally{

    busy = false;

    generateButton.disabled =
      false;

    generateButton.textContent =
      'Generate Neural Voice';

  }

};


/* =========================
   INITIAL UI
========================= */

updateRanges();

count.textContent =
  script.value.length;

</script>
